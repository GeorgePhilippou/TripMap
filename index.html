<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Trip Map</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#5D7350">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Trip Map">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F0E2; --surface:#FAF8EF; --surface2:#EFEBDC; --border:#DBD5C0;
    --text:#262A1C; --muted:#6E7260; --accent:#5D7350; --accent-ink:#F6F5EA; --accent-soft:#DCE4CC;
    --sight:#4F6B44;      --sight-soft:#DCE4CC;
    --food:#8A6A28;       --food-soft:#F0E3BE;
    --beach:#396F6C;      --beach-soft:#D3E6E3;
    --historical:#7D5A3C; --historical-soft:#EAE0D0;
    --fruit:#B25A34;      --fruit-soft:#F5DED0;
    --shops:#8A4F6E;      --shops-soft:#F0DCE8;
    --general:#5C6470;    --general-soft:#E1E3E6;
    --activity:#6E7A2E;   --activity-soft:#E7EAC9;
    --stays:#93544A;      --stays-soft:#F0DAD3;
    --airport:#4A5E8A;    --airport-soft:#DBE2F0;
    --hike:#65588F;       --hike-soft:#E1DCF0;
    --overlay:rgba(250,248,239,.85);
    --danger-bg:#F5DEDB; --danger-border:#E0B7B1; --danger-text:#9A3E33;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;overscroll-behavior:none;}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; justify-content:center;
    height:100vh; height:100dvh; overflow:hidden;
  }
  #app{ width:100%; max-width:480px; height:100%; display:flex; flex-direction:column; position:relative;
    border-left:1px solid var(--border); border-right:1px solid var(--border); overflow:hidden; }

  @media (min-width:760px){
    body{ align-items:center; background:var(--surface2); }
    #app{
      max-width:640px; height:calc(100dvh - 64px); margin:32px 0;
      border:1px solid var(--border); border-radius:20px;
      box-shadow:0 24px 60px rgba(0,0,0,.14);
    }
    #editor-box{ max-width:640px; border-radius:18px; border-bottom:1px solid var(--border); margin-bottom:32px; }
    #editor{ align-items:center; }
    #menu-box{ max-width:600px; }
  }

  /* ---- top bar (shared) ---- */
  .topbar{ display:flex; align-items:center; justify-content:flex-end; padding:calc(10px + env(safe-area-inset-top)) 18px 0; flex-shrink:0; }
  .icon-btn{
    background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:10px;
    width:34px; height:34px; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:hover{ border-color:var(--accent); }

  /* ---- home screen ---- */
  .screen{ display:none; flex-direction:column; flex:1; min-height:0; overflow-y:auto; padding-bottom:16px; }
  #screen-home{ overflow:hidden; padding-bottom:calc(14px + env(safe-area-inset-bottom)); }
  .screen.active{ display:flex; }
  .eyebrow{ font-size:12px; color:var(--accent); letter-spacing:.06em; text-transform:uppercase; margin-bottom:4px; font-weight:600; }
  h1.trip-title{ font-family:'Fraunces',serif; font-weight:500; font-size:clamp(26px,7.5vh,34px); margin:0 0 2px; letter-spacing:-.01em; line-height:1.1; }
  .trip-sub{ color:var(--muted); font-size:14px; }
  .home-header{ padding:4px 18px 0; flex-shrink:0; }
  .progress-track{ height:4px; background:var(--accent-soft); border-radius:3px; margin-top:5px; overflow:hidden; display:none; }
  .progress-fill{ height:100%; width:0; background:var(--accent); border-radius:3px; transition:width .3s ease; }
  .info-strip{ display:flex; flex-wrap:wrap; gap:5px; margin-top:5px; }
  .info-pill{
    background:var(--accent-soft); border:1px solid var(--accent-soft); border-radius:8px; padding:4px 8px;
    font-size:11px; color:var(--text); display:flex; align-items:center; gap:5px; max-width:100%;
  }
  .info-pill svg{ width:14px; height:14px; flex-shrink:0; color:var(--accent); }
  .info-pill span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .info-pill .activity-dot{ width:6px; height:6px; border-radius:50%; background:var(--accent); flex-shrink:0; }
  .info-pill.clickable{ cursor:pointer; }
  .info-pill.clickable:hover{ border-color:var(--accent); }

  .hero{
    margin:8px 18px 0; border-radius:16px; overflow:hidden; border:1px solid var(--border);
    position:relative; height:clamp(64px,var(--hero-h,10vh),320px); background:linear-gradient(160deg,var(--surface2),var(--surface));
    display:flex; align-items:flex-end; padding:8px; cursor:pointer; flex-shrink:0;
    box-shadow:0 1px 3px rgba(38,42,28,.05);
    transition:height .25s ease;
  }
  .hero:hover{ border-color:var(--accent); }
  .hero-map{ position:absolute; inset:0; z-index:0; pointer-events:none; }
  .hero-photo{ position:absolute; inset:0; z-index:0; background-size:cover; background-position:center; display:none; }
  .hero-pill{ position:relative; z-index:1; background:var(--overlay); border:1px solid var(--accent); border-radius:10px; padding:7px 11px; font-size:13px; }
  .hero-pill b{ font-weight:600; }
  .hero-pill .count{ color:var(--muted); font-size:11px; }
  .hero-empty{ color:var(--muted); font-size:13px; }

  .grid{ display:grid; grid-template-columns:1fr 1fr; grid-template-rows:repeat(3,minmax(0,1fr)); gap:6px; margin:8px 18px 0; flex:1; min-height:0; }
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:7px 12px; display:flex; flex-direction:column; justify-content:center; gap:2px; cursor:pointer; min-height:0;
    box-shadow:0 1px 3px rgba(38,42,28,.04); overflow:hidden;
  }
  .card:hover{ border-color:var(--accent); }
  .cat-icon{ width:26px; height:26px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0; }
  .card-title{ font-size:14px; font-weight:600; line-height:1.15; }
  .card-count{ font-size:12px; color:var(--muted); line-height:1.15; }
  .chev{ color:var(--muted); font-size:18px; }

  /* ---- category / list screen ---- */
  .cat-header{ display:flex; align-items:center; gap:10px; padding:calc(10px + env(safe-area-inset-top)) 18px 0; flex-shrink:0; }
  .cat-header h2{ font-family:'Fraunces',serif; font-weight:500; font-size:25px; margin:0; flex:1; }
  .cat-banner{
    position:relative; height:130px; flex-shrink:0; overflow:hidden;
    display:flex; align-items:flex-start; padding:calc(10px + env(safe-area-inset-top)) 18px 0;
    background-size:cover; background-position:center;
  }
  .cat-banner .icon-btn{
    position:relative; z-index:1; background:var(--overlay); backdrop-filter:blur(6px);
    box-shadow:0 2px 8px rgba(0,0,0,.15);
  }
  .cat-banner-icon{ position:absolute; right:-14px; bottom:-22px; opacity:.3; color:#fff; pointer-events:none; }
  .cat-banner-icon svg{ width:120px; height:120px; }
  .cat-title-row{ padding:14px 18px 0; flex-shrink:0; display:flex; align-items:center; gap:10px; }
  .cat-title-row h2{ font-family:'Fraunces',serif; font-weight:500; font-size:25px; margin:0; flex:1; }
  .icon-btn.active{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  #catSortBtn{ color:var(--accent); }
  #catSortBtn.active{ color:var(--accent-ink); }
  .place-list{ margin-top:8px; }
  .place{ padding:14px 18px; border-bottom:1px solid var(--border); cursor:pointer; display:flex; align-items:center; gap:12px; }
  .place:hover{ background:var(--surface); }
  .place.visited .place-name{ text-decoration:line-through; color:var(--muted); }
  .place-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .place-thumb{ width:36px; height:36px; border-radius:8px; object-fit:cover; flex-shrink:0; }
  .place-main{ flex:1; min-width:0; }
  .place-name{ font-weight:500; font-size:15px; display:block; }
  .place-notes{ font-size:12px; color:var(--muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .place-visited-tag{ font-size:11px; color:var(--muted); flex-shrink:0; }
  .empty-hint{ padding:24px 18px; color:var(--muted); font-size:13px; line-height:1.6; text-align:center; }

  /* ---- itinerary ---- */
  .itinerary-day-label{ font-size:11px; color:var(--accent); text-transform:uppercase; letter-spacing:.04em; padding:18px 18px 6px; font-weight:600; }

  .suggest-label{ font-size:11px; color:var(--accent); text-transform:uppercase; letter-spacing:.04em; padding:18px 18px 6px; }
  .suggest-row{ display:flex; align-items:center; gap:10px; padding:10px 18px; border-bottom:1px solid var(--border); }
  .suggest-dot{ width:9px; height:9px; border-radius:50%; border:1.5px solid var(--border); flex-shrink:0; }
  .suggest-name{ flex:1; font-size:15px; }
  .suggest-actions{ display:flex; gap:6px; flex-shrink:0; }
  .suggest-btn{
    width:30px; height:30px; border-radius:8px; border:1px solid var(--border); background:var(--surface2);
    color:var(--text); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:14px;
  }
  .suggest-btn:hover{ border-color:var(--accent); }
  .suggest-btn.been{ color:var(--accent); border-color:var(--accent); }

  /* ---- category settings screen ---- */
  .settings-list{ overflow-y:auto; }
  .settings-row{ display:flex; align-items:center; gap:12px; padding:12px 18px; border-bottom:1px solid var(--border); }
  .settings-row .cat-icon{ width:28px; height:28px; font-size:13px; }
  .settings-label{ flex:1; font-size:14px; }
  .toggle{ width:40px; height:24px; border-radius:12px; background:var(--surface2); border:1px solid var(--border); position:relative; cursor:pointer; flex-shrink:0; }
  .toggle.on{ background:var(--accent); border-color:var(--accent); }
  .toggle-knob{
    position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%;
    background:var(--surface); box-shadow:0 1px 3px rgba(38,42,28,.3); transition:left .15s;
  }
  .toggle.on .toggle-knob{ left:18px; }

  /* ---- map screen ---- */
  #screen-map{ padding-bottom:0; }
  #mapWrap{ flex:1; position:relative; min-height:0; display:flex; flex-direction:column; }
  #map{ flex:1; }
  .map-topbar{ position:absolute; top:calc(14px + env(safe-area-inset-top)); left:14px; right:14px; z-index:500; display:flex; justify-content:space-between; }
  .map-topbar .icon-btn{
    background:var(--accent); color:var(--accent-ink); border:none;
    box-shadow:0 2px 8px rgba(0,0,0,.18);
  }
  .search-wrap{ position:absolute; top:calc(60px + env(safe-area-inset-top)); left:14px; right:14px; z-index:500; }
  .search-wrap input{
    width:100%; background:var(--overlay); backdrop-filter:blur(6px); color:var(--text);
    border:1px solid var(--border); border-radius:10px; padding:10px 12px; font-size:13px; font-family:inherit;
  }
  .search-results{
    margin-top:6px; background:var(--overlay); backdrop-filter:blur(6px); border:1px solid var(--border);
    border-radius:10px; overflow:hidden; display:none; max-height:240px; overflow-y:auto;
  }
  .search-results.show{ display:block; }
  .search-result-row{ padding:10px 12px; font-size:13px; cursor:pointer; border-bottom:1px solid var(--border); }
  .search-result-row:last-child{ border-bottom:none; }
  .search-result-row:hover{ background:var(--surface2); }
  .search-pin{
    width:15px; height:15px; border-radius:50%; background:var(--accent);
    border:2px solid var(--accent-ink); box-shadow:0 1px 4px rgba(0,0,0,.35);
  }
  .you-are-here{
    width:16px; height:16px; border-radius:50%; background:var(--accent); border:3px solid var(--surface);
    box-shadow:0 0 0 5px rgba(93,115,80,.28), 0 1px 4px rgba(0,0,0,.3);
  }
  .locate-btn{ box-shadow:0 2px 8px rgba(0,0,0,.12); color:var(--accent); }
  .pin-crosshair{
    position:absolute; top:50%; left:50%; margin-left:-14px; margin-top:-32px; z-index:600;
    display:none; pointer-events:none;
  }
  .pin-crosshair.show{ display:block; }
  .pin-crosshair-icon{
    width:26px; height:26px; border-radius:50% 50% 50% 0; transform:rotate(-45deg);
    background:var(--accent); border:2px solid rgba(0,0,0,.4); box-shadow:0 3px 8px rgba(0,0,0,.4);
  }
  .place-confirm-bar{
    position:absolute; left:14px; right:14px; bottom:calc(14px + env(safe-area-inset-bottom));
    z-index:600; display:none; gap:8px;
  }
  .place-confirm-bar.show{ display:flex; }
  .place-confirm-bar .btn{ flex:1; }
  .place-confirm-bar .btn-primary{ flex:2; }
  .menu-footer{
    text-align:center; font-size:11px; color:var(--muted); opacity:.7; padding:14px 14px 4px;
    border-top:1px solid var(--border); margin-top:8px; line-height:1.6;
  }


  /* ---- editor bottom sheet ---- */
  #editor{ position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:flex-end; justify-content:center; z-index:1000; }
  #editor.open{ display:flex; }
  #editor-box{
    background:var(--surface); border:1px solid var(--border); border-bottom:none;
    border-radius:18px 18px 0 0; padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    width:100%; max-width:480px; display:flex; flex-direction:column; gap:12px;
  }
  #editor-box h3{ font-family:'Fraunces',serif; font-weight:500; margin:0 0 2px; font-size:19px; }
  #editor-box label{ font-size:11px; color:var(--accent); text-transform:uppercase; letter-spacing:.04em; }
  #editor-box input, #editor-box select, #editor-box textarea{
    width:100%; background:var(--surface2); color:var(--text); border:1px solid var(--border);
    border-radius:8px; padding:10px; font-size:14px; font-family:inherit; margin-top:4px;
  }
  #editor-box textarea{ min-height:64px; resize:vertical; }
  .editor-row{ display:flex; gap:10px; }
  .editor-row > div{ flex:1; }
  .editor-actions{ display:flex; justify-content:space-between; margin-top:4px; gap:8px; }
  button{ font-family:inherit; }
  .btn{ background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:10px 14px; font-size:13px; cursor:pointer; }
  .btn:hover{ border-color:var(--accent); }
  .btn-danger{ background:var(--danger-bg); border-color:var(--danger-border); color:var(--danger-text); }
  .btn-primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600; }
  .photo-preview-wrap{ position:relative; width:100%; margin-top:4px; }
  .photo-preview{ width:100%; max-height:160px; object-fit:cover; border-radius:8px; display:block; }
  .photo-remove{
    position:absolute; top:6px; right:6px; width:26px; height:26px; border-radius:50%;
    background:rgba(0,0,0,.6); color:#fff; border:none; cursor:pointer; font-size:12px;
  }
  .photo-add-btn{
    margin-top:4px; width:100%; background:var(--surface2); color:var(--text);
    border:1px dashed var(--border); border-radius:8px; padding:10px; font-size:13px; cursor:pointer;
  }
  .photo-add-btn:hover{ border-color:var(--accent); }

  /* ---- trip menu ---- */
  #menu{ position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:flex-start; justify-content:center; z-index:1000; }
  #menu.open{ display:flex; }
  #menu-box{
    background:var(--surface); border:1px solid var(--border); border-radius:14px; margin-top:64px;
    padding:10px; width:calc(100% - 36px); max-width:440px; display:flex; flex-direction:column; gap:2px;
  }
  #menu-box .menu-item{
    padding:12px 14px; border-radius:8px; cursor:pointer; font-size:14px; display:flex; justify-content:space-between; align-items:center;
  }
  #menu-box .menu-item:hover{ background:var(--surface2); }
  #roomStatus{ font-size:12px; color:var(--muted); max-width:140px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #menu-box .menu-label{ font-size:11px; color:var(--accent); text-transform:uppercase; letter-spacing:.04em; padding:10px 14px 2px; }
  #menu-box select{ width:100%; background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:10px; font-size:14px; font-family:inherit; }

  .leaflet-div-icon{ background:transparent; border:none; }
  .pin{ width:28px; height:28px; border-radius:50% 50% 50% 0; transform:rotate(-45deg);
    border:2px solid rgba(0,0,0,.4); box-shadow:0 1px 3px rgba(0,0,0,.5);
    display:flex; align-items:center; justify-content:center; }
  .pin-icon{ transform:rotate(45deg); color:var(--accent-ink); display:flex; }
  .pin-icon svg{ width:14px; height:14px; }
  input[type=file]{ display:none; }

  /* ---- map marker popup ---- */
  .leaflet-popup-content-wrapper{ background:var(--surface); color:var(--text); border-radius:12px; box-shadow:0 6px 20px rgba(0,0,0,.18); }
  .leaflet-popup-tip{ background:var(--surface); }
  .leaflet-popup-content{ margin:10px 12px; font-family:'Inter',sans-serif; min-width:140px; }
  .leaflet-popup-close-button{ color:var(--muted) !important; }
  .map-popup-name{ font-weight:600; font-size:14px; }
  .map-popup-meta{ font-size:12px; color:var(--muted); margin-top:2px; text-transform:capitalize; }
  .map-popup-actions{ display:flex; gap:6px; margin-top:8px; }
  .map-popup-btn{
    flex:1; background:var(--accent); color:var(--accent-ink); border:none;
    border-radius:8px; padding:7px; font-size:12px; font-weight:600; cursor:pointer; font-family:inherit;
    text-align:center; text-decoration:none; display:block;
  }
  .map-popup-btn.secondary{ background:var(--surface2); color:var(--text); border:1px solid var(--border); }

  /* ---- map legend ---- */
  .map-legend{
    position:absolute; bottom:14px; left:14px; z-index:500;
    background:var(--overlay); backdrop-filter:blur(6px); border:1px solid var(--border); border-radius:12px;
    padding:10px 12px; display:none; max-width:170px; box-shadow:0 4px 16px rgba(0,0,0,.12);
  }
  .map-legend.show{ display:block; }
  .legend-row{ display:flex; align-items:center; gap:8px; padding:3px 0; font-size:12px; }
  .legend-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }

  /* ---- undo toast ---- */
  .toast{
    position:absolute; left:14px; right:14px; bottom:calc(14px + env(safe-area-inset-bottom));
    background:var(--text); color:var(--surface); border-radius:12px; padding:12px 14px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    box-shadow:0 8px 24px rgba(0,0,0,.25); z-index:900; font-size:13px;
    transform:translateY(120%); opacity:0; transition:transform .2s ease, opacity .2s ease; pointer-events:none;
  }
  .toast.show{ transform:translateY(0); opacity:1; pointer-events:auto; }
  .toast button{ background:none; border:none; color:inherit; font-weight:700; font-size:13px; cursor:pointer; flex-shrink:0; text-decoration:underline; font-family:inherit; }
</style>
</head>
<body>
<div id="app">

  <!-- HOME -->
  <section id="screen-home" class="screen active">
    <div class="topbar">
      <button class="icon-btn" id="menuBtn">&#8942;</button>
    </div>
    <div class="home-header">
      <div class="eyebrow" id="tripDates">Trip</div>
      <h1 class="trip-title" id="tripName">Trip</h1>
      <div class="trip-sub" id="tripSummary">0 places saved</div>
      <div class="progress-track" id="progressTrack"><div class="progress-fill" id="progressFill"></div></div>
      <div class="info-strip" id="infoStrip"></div>
    </div>

    <div class="hero" id="heroCard">
      <div id="heroMap" class="hero-map"></div>
      <div id="heroPhoto" class="hero-photo"></div>
      <div class="hero-pill" id="heroPill"><span class="hero-empty">No places yet — tap + on the map to start</span></div>
    </div>

    <div class="grid" id="categoryGrid"></div>
  </section>

  <!-- CATEGORY LIST -->
  <section id="screen-category" class="screen">
    <div class="cat-banner" id="catBanner">
      <button class="icon-btn" id="catBackBtn">&#8592;</button>
      <div class="cat-banner-icon" id="catBannerIcon"></div>
    </div>
    <div class="cat-title-row">
      <h2 id="catTitle">Category</h2>
      <button class="icon-btn" id="catSortBtn" title="Sort by distance">
        <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="3"/><path d="M10 1.5v3M10 15.5v3M1.5 10h3M15.5 10h3"/></svg>
      </button>
    </div>
    <div class="place-list" id="catList"></div>
  </section>

  <!-- ITINERARY -->

function distanceKm(lat1, lng1, lat2, lng2){
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function formatRelativeTime(ts){
  if (!ts) return '';
  const min = Math.floor((Date.now() - ts) / 60000);
  if (min < 1) return 'just now';
  if (min < 60) return `${min}m ago`;
  const hr = Math.floor(min / 60);
  if (hr < 24) return `${hr}h ago`;
  const day = Math.floor(hr / 24);
  if (day < 7) return `${day}d ago`;
  return `${Math.floor(day / 7)}w ago`;
}
function computeCountdownText(start, end){
  if (!start) return null;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const startD = new Date(start + 'T00:00:00');
  const endD = end ? new Date(end + 'T00:00:00') : startD;
  const oneDay = 86400000;
  if (today < startD){
    const days = Math.round((startD - today) / oneDay);
    return days === 1 ? '1 day to go' : `${days} days to go`;
  }
  if (today <= endD){
    const day = Math.round((today - startD) / oneDay) + 1;
    const total = Math.round((endD - startD) / oneDay) + 1;
    return total > 1 ? `Day ${day} of ${total}` : 'Today';
  }
  return 'Trip complete';
}

function zoomForPlaceRank(rank){
  if (rank == null) return 9;
  if (rank <= 4) return 5;   // continent / country
  if (rank <= 8) return 7;   // state / province / metropolis
  if (rank <= 10) return 9;  // county / large region
  if (rank <= 12) return 10; // large city / metro area
  if (rank <= 16) return 12; // city / town

}
function boundsSpanReasonable(bounds, rank){
  if (!bounds) return false;
  const [[south, west], [north, east]] = bounds;
  const span = Math.max(north - south, east - west);
  const maxAllowed = rank == null ? 15
    : rank <= 4 ? 70 : rank <= 8 ? 15 : rank <= 10 ? 6 : rank <= 12 ? 2.5 : rank <= 16 ? 1.2 : 0.6;
  return span <= maxAllowed;
}

function resizeImageFile(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim){ height = Math.round(height * maxDim / width); width = maxDim; }
        else if (height > maxDim){ width = Math.round(width * maxDim / height); height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function initMap(){

      L.DomEvent.disableClickPropagation(btn);

      return btn;
    }
  });
  new LocateControl().addTo(map);
}
let userLocationMarker = null, userLatLng = null;
function locateUser(onDone){
  if (!navigator.geolocation){ alert('Location is not available in this browser.'); return; }
  navigator.geolocation.getCurrentPosition(
    pos => {
      const latlng = [pos.coords.latitude, pos.coords.longitude];
      userLatLng = latlng;
      if (userLocationMarker) map.removeLayer(userLocationMarker);
      userLocationMarker = L.marker(latlng, {
        icon: L.divIcon({ className: 'leaflet-div-icon', html: '<div class="you-are-here"></div>', iconSize: [18, 18], iconAnchor: [9, 9] }),
        zIndexOffset: -1000
      }).addTo(map);
      map.flyTo(latlng, Math.max(map.getZoom(), 14));
      if (onDone) onDone();
    },
    err => { alert('Could not get your location: ' + err.message); },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

function stopPlacing(){

function getTripViewbox(){
  // Prefer the trip's own curated/geocoded bounds - stable regardless of how the user
  // has panned or zoomed. Deriving the box from the live viewport (even padded) risks
  // spilling into a neighbouring country once padding is added to an already-wide view
  // (e.g. Cyprus + padding reaching into Turkey's coastline).
  if (currentTrip.searchBounds){
    const [[south, west], [north, east]] = currentTrip.searchBounds;
    return [west, north, east, south];
  }
  const b = map.getBounds().pad(0.15);
  return [b.getWest(), b.getNorth(), b.getEast(), b.getSouth()];
}
function searchPinIcon(){
  return L.divIcon({ className: 'leaflet-div-icon', html: `<div class="search-pin"></div>`, iconSize: [15, 15], iconAnchor: [8, 8] });
}
function clearSearchMarkers(){
  searchMarkers.forEach(m => map.removeLayer(m));
  searchMarkers = [];
}
function clearSearchResults(){
  clearSearchMarkers();
  lastSearchResults = [];
  el('searchResults').classList.remove('show');
  el('searchResults').innerHTML = '';
}
function selectSearchResult(r){
  clearSearchResults();
  el('search').value = '';
  const lat = parseFloat(r.lat), lon = parseFloat(r.lon);
  map.flyTo([lat, lon], 16);
  openEditor(null, { lat, lng: lon });
  el('f-name').value = r.display_name.split(',')[0];
}
function parseLocationInput(raw){
  const text = (raw || '').trim();
  if (!text) return null;

  const coordMatch = text.match(/^(-?\d{1,3}(?:\.\d+)?)\s*,\s*(-?\d{1,3}(?:\.\d+)?)$/);
  if (coordMatch){
    const lat = parseFloat(coordMatch[1]), lng = parseFloat(coordMatch[2]);
    if (Math.abs(lat) <= 90 && Math.abs(lng) <= 180) return { lat, lng, name: '' };
  }

  const urlMatch = text.match(/https?:\/\/\S+/);
  const url = urlMatch ? urlMatch[0] : (/^https?:\/\//.test(text) ? text : null);
  if (url){
    let u;
    try { u = new URL(url); } catch (err) { return { query: text }; }

    if (u.hostname.includes('maps.apple.com')){
      const ll = u.searchParams.get('ll') || u.searchParams.get('coordinate');
      const name = u.searchParams.get('q') || u.searchParams.get('name') || '';
      if (ll){
        const [lat, lng] = ll.split(',').map(parseFloat);
        if (!isNaN(lat) && !isNaN(lng)) return { lat, lng, name };
      }
    }

    if (u.hostname.includes('google.') && u.pathname.includes('/maps')){
      let name = '';
      const placeMatch = u.pathname.match(/\/place\/([^/@]+)/);
      if (placeMatch) name = decodeURIComponent(placeMatch[1].replace(/\+/g, ' '));
      const qParam = u.searchParams.get('q') || u.searchParams.get('query');
      if (qParam && /^-?\d+\.\d+,-?\d+\.\d+$/.test(qParam)){
        const [lat, lng] = qParam.split(',').map(parseFloat);
        return { lat, lng, name };
      }
      const atMatch = u.href.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
      if (atMatch) return { lat: parseFloat(atMatch[1]), lng: parseFloat(atMatch[2]), name };
    }

    // Shortened link (e.g. maps.app.goo.gl) or an unrecognized maps URL -
    // the real destination is server-side only; this single-file client-side
    // app has no backend to follow the redirect and read the resolved coords.
    return { unresolved: true, url };
  }

  return { query: text };
}
function handleParsedLocation(parsed){
  if (!parsed) return false;
  if (parsed.lat != null && parsed.lng != null){
    clearSearchResults();
    el('search').value = '';
    map.flyTo([parsed.lat, parsed.lng], 16);
    openEditor(null, { lat: parsed.lat, lng: parsed.lng });
    if (parsed.name) el('f-name').value = parsed.name;
    return true;
  }
  if (parsed.unresolved){
    alert('That looks like a shortened Maps link, which can’t be read directly. Try sharing the full address or place name instead, or use "Copy Address" in Maps and paste that here.');
    return true;
  }
  return false;
}
function handleSharedLaunch(){
  const params = new URLSearchParams(location.search);
  const shared = [params.get('text'), params.get('url'), params.get('title')].filter(Boolean).join(' ').trim();
  if (!shared) return;
  history.replaceState({}, '', location.pathname);
  const parsed = parseLocationInput(shared);
  if (parsed && parsed.lat != null){
    showScreen('screen-map');
    handleParsedLocation(parsed);
  } else if (parsed && parsed.unresolved){
    showScreen('screen-map');
    alert('You shared a Maps link, but it’s a shortened link Trip Map can’t read directly. Share the address or place name instead, or paste it into the search bar.');
  } else {
    showScreen('screen-map');
    el('search').value = shared;
    runSearch(shared);
  }
}
function renderSearchResults(results){
  clearSearchMarkers();
  const box = el('searchResults');
  if (!results.length){ box.classList.remove('show'); box.innerHTML = ''; return; }
  box.innerHTML = '';
  results.forEach(r => {
    const row = document.createElement('div');
    row.className = 'search-result-row';
    row.textContent = r.display_name.split(',').slice(0, 3).join(',');
    row.addEventListener('click', () => selectSearchResult(r));
    box.appendChild(row);

    const marker = L.marker([parseFloat(r.lat), parseFloat(r.lon)], { icon: searchPinIcon() }).addTo(map);
    marker.on('click', () => selectSearchResult(r));
    searchMarkers.push(marker);
  });
  box.classList.add('show');
}
async function runSearch(query){
  lastSearchQuery = query;
  if (!query || query.length < 2){ clearSearchResults(); return; }
  const [west, north, east, south] = getTripViewbox();
  const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=6'
    + '&viewbox=' + [west, north, east, south].join(',') + '&bounded=1&q=' + encodeURIComponent(query);
  let results = [];
  try { results = await (await fetch(url)).json(); } catch (err) { results = []; }
  lastSearchResults = results;
  renderSearchResults(results);
}
function pinIcon(cat){
  const color = categoryColor(cat);
  const catObj = CAT_BY_KEY[cat];
  const iconSvg = catObj ? catObj.icon : '';
  return L.divIcon({
    className: 'leaflet-div-icon',
    html: `<div class="pin" style="background:${color}"><div class="pin-icon">${iconSvg}</div></div>`,
    iconSize: [28, 28],
    iconAnchor: [14, 26]
  });
}
function renderMapLegend(){
  el('mapLegendList').innerHTML = CATEGORIES.map(c => `
    <div class="legend-row">
      <span class="legend-dot" style="background:var(--${c.key})"></span>

    </div>`).join('');
}
function renderMarkers(){
  Object.values(markers).forEach(m => map.removeLayer(m));
  markers = {};
  currentTrip.places.forEach(p => {
    const m = L.marker([p.lat, p.lng], { icon: pinIcon(p.category) }).addTo(map);
    const thumb = p.photo ? `<img src="${p.photo}" style="width:100%;max-width:180px;height:90px;object-fit:cover;border-radius:8px;margin-bottom:6px;display:block;">` : '';
    const cat = CAT_BY_KEY[p.category];
    m.bindPopup(`
      <div class="map-popup">

        <div class="map-popup-actions">

          <a class="map-popup-btn secondary" href="${directionsUrl(p.lat, p.lng)}" target="_blank" rel="noopener">Directions</a>
        </div>
      </div>`);
    markers[p.id] = m;
  });
}

/* ---- home ---- */
function renderHome(){
  const visibleCats = CATEGORIES.filter(c => currentTrip.visibleCategories.includes(c.key));
  const rows = visibleCats.length ? Math.ceil(visibleCats.length / 2) : 1;
  document.documentElement.style.setProperty('--hero-h', Math.max(9, 27 - rows * 3.2) + 'vh');

  el('tripName').textContent = currentTrip.name || 'Trip';
  const countdown = computeCountdownText(currentTrip.startDate, currentTrip.endDate);
  el('tripDates').textContent = countdown || currentTrip.dates || 'Trip';
  const total = currentTrip.places.length;
  const visited = currentTrip.places.filter(p => p.visited).length;
  el('tripSummary').textContent = total
    ? `${total} place${total===1?'':'s'} saved · ${visited} visited`
    : 'No places yet';
  if (total){
    el('progressTrack').style.display = 'block';
    el('progressFill').style.width = Math.round(visited / total * 100) + '%';
  } else {
    el('progressTrack').style.display = 'none';
  }

  const pills = [];
  if (weatherData){
    pills.push(`<div class="info-pill">${weatherIcon(weatherData.code)}<span>${weatherData.current}&deg; &middot; H:${weatherData.max}&deg; L:${weatherData.min}&deg;</span></div>`);
  }
  const recent = currentTrip.places.filter(p => p.addedAt).sort((a, b) => b.addedAt - a.addedAt)[0];
  if (recent){
    pills.push(`<div class="info-pill clickable" id="recentActivityPill"><span class="activity-dot"></span><span>${escapeHtml(recent.addedBy || 'Someone')} added <b>${escapeHtml(recent.name)}</b> &middot; ${formatRelativeTime(recent.addedAt)}</span></div>`);
  }
  el('infoStrip').innerHTML = pills.join('');
  if (recent){
    el('recentActivityPill').addEventListener('click', () => openEditor(recent.id));
  }

  const next = currentTrip.places.find(p => !p.visited);
  const heroPhoto = el('heroPhoto');
  if (next && next.photo){
    heroPhoto.style.backgroundImage = `linear-gradient(160deg, rgba(0,0,0,.1), rgba(0,0,0,.55)), url(${next.photo})`;
    heroPhoto.style.display = 'block';
  } else {
    heroPhoto.style.display = 'none';
    updateHeroMap();
  }
  if (next){
    el('heroPill').innerHTML = `<b>${escapeHtml(next.name)}</b><div class="count">Next up</div>`;
  } else {
    el('heroPill').innerHTML = total
      ? `<span class="hero-empty">All caught up — everything visited</span>`
      : `<span class="hero-empty">No places yet — tap + on the map to start</span>`;
  }

  const grid = el('categoryGrid');
  grid.innerHTML = '';
  if (!visibleCats.length){
    grid.style.gridTemplateRows = '';
    grid.innerHTML = `<div class="empty-hint" style="grid-column:span 2;">No categories shown. Turn some on from the menu &rarr; Homepage categories.</div>`;
    return;
  }
  grid.style.gridTemplateRows = `repeat(${Math.ceil(visibleCats.length / 2)}, minmax(0,1fr))`;
  visibleCats.forEach(c => {
    const count = currentTrip.places.filter(p => p.category === c.key).length;
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="cat-icon" style="background:var(--${c.key}-soft);color:var(--${c.key})">${c.icon}</div>
      <div class="card-title">${c.label}</div>
      <div class="card-count">${count} place${count===1?'':'s'}</div>`;
    card.addEventListener('click', () => openCategory(c.key));
    grid.appendChild(card);
  });
}

function renderCatSettings(){
  const list = el('catSettingsList');
  list.innerHTML = '';
  CATEGORIES.forEach(c => {
    const visible = currentTrip.visibleCategories.includes(c.key);
    const row = document.createElement('div');
    row.className = 'settings-row';
    row.innerHTML = `
      <div class="cat-icon" style="background:var(--${c.key}-soft);color:var(--${c.key})">${c.icon}</div>
      <div class="settings-label">${c.label}</div>
      <div class="toggle ${visible ? 'on' : ''}"><div class="toggle-knob"></div></div>`;
    row.querySelector('.toggle').addEventListener('click', () => toggleCategoryVisible(c.key));
    list.appendChild(row);
  });
}
function toggleCategoryVisible(key){
  const idx = currentTrip.visibleCategories.indexOf(key);
  if (idx >= 0) currentTrip.visibleCategories.splice(idx, 1);
  else currentTrip.visibleCategories.push(key);
  saveVisibleCategories(currentTripFile, currentTrip.visibleCategories);
  renderCatSettings();
  renderHome();
}

/* ---- category list ---- */
function renderCatBanner(key){
  const cat = CAT_BY_KEY[key];
  const banner = el('catBanner');
  const withPhoto = currentTrip.places.find(p => p.category === key && p.photo);
  if (withPhoto){
    banner.style.backgroundImage = `linear-gradient(180deg, rgba(0,0,0,.05), rgba(0,0,0,.4)), url(${withPhoto.photo})`;
    el('catBannerIcon').innerHTML = '';
  } else {
    banner.style.backgroundImage = `linear-gradient(135deg, var(--${key}), var(--${key}-soft))`;
    el('catBannerIcon').innerHTML = cat.icon;
  }
}
function openCategory(key){
  activeCategory = key;
  const cat = CAT_BY_KEY[key];
  el('catTitle').textContent = cat.label;
  renderCatBanner(key);
  const places = currentTrip.places.filter(p => p.category === key);
  const useDistanceSort = sortByDistance && userLatLng;
  const sorted = places.slice().sort((a, b) => useDistanceSort
    ? distanceKm(userLatLng[0], userLatLng[1], a.lat, a.lng) - distanceKm(userLatLng[0], userLatLng[1], b.lat, b.lng)
    : (a.visited === b.visited) ? 0 : (a.visited ? 1 : -1));
  el('catSortBtn').classList.toggle('active', !!useDistanceSort);
  const list = el('catList');
  list.innerHTML = '';
  if (!places.length){
    list.innerHTML = `<div class="empty-hint">No ${cat.label.toLowerCase()} yet. Tap + on the map to add one, or pick a suggestion below.</div>`;
  } else {
    sorted.forEach(p => {
      const div = document.createElement('div');
      div.className = 'place' + (p.visited ? ' visited' : '');
      const metaParts = [];
      if (p.notes) metaParts.push(escapeHtml(p.notes));
      if (userLatLng) metaParts.push(`${formatDistance(distanceKm(userLatLng[0], userLatLng[1], p.lat, p.lng))} away`);
      div.innerHTML = `
        ${p.photo ? `<img class="place-thumb" src="${p.photo}">` : `<span class="place-dot" style="background:var(--${p.category})"></span>`}
        <div class="place-main">
          <span class="place-name">${escapeHtml(p.name)}</span>
          ${metaParts.length ? `<div class="place-notes">${metaParts.join(' &middot; ')}</div>` : ''}
        </div>
        ${p.visited ? '<span class="place-visited-tag">Been</span>' : ''}
        <span class="chev">&#8250;</span>`;
      div.addEventListener('click', () => openEditor(p.id));
      list.appendChild(div);
    });
  }

  const suggestions = (currentTrip.suggestions && currentTrip.suggestions[key]) || [];
  const addedIds = new Set(currentTrip.places.map(p => p.fromSuggestion).filter(Boolean));
  const remaining = suggestions.filter(s => !addedIds.has(s.id));
  if (remaining.length){
    const label = document.createElement('div');
    label.className = 'suggest-label';
    label.textContent = 'Suggested';
    list.appendChild(label);
    remaining.forEach(s => {
      const row = document.createElement('div');
      row.className = 'suggest-row';
      row.innerHTML = `
        <span class="suggest-dot"></span>
        <span class="suggest-name">${escapeHtml(s.name)}</span>
        <div class="suggest-actions">
          <button class="suggest-btn been" title="Mark as been">&#10003;</button>
          <button class="suggest-btn" title="Add to want-to-go">+</button>
        </div>`;
      row.querySelector('.been').addEventListener('click', () => quickAddSuggestion(s, key, true));
      row.querySelector('.suggest-actions > :last-child').addEventListener('click', () => quickAddSuggestion(s, key, false));
      list.appendChild(row);
    });
  }

  showScreen('screen-category');
}
function quickAddSuggestion(s, key, visited){
  currentTrip.places.push({
    id: uid(), lat: s.lat, lng: s.lng, name: s.name, category: key,
    visited, notes: '', photo: null, fromSuggestion: s.id,
    addedBy: getUserName(), addedAt: Date.now()
  });
  saveTrip();
  renderMarkers();
  renderHome();
  openCategory(key);
}

/* ---- itinerary ---- */
function renderItinerary(){
  const grouped = {};
  currentTrip.places.forEach(p => {
    if (p.day){ (grouped[p.day] = grouped[p.day] || []).push(p); }
  });
  const days = Object.keys(grouped).map(Number).sort((a, b) => a - b);
  const list = el('itineraryList');
  list.innerHTML = '';
  if (!days.length){
    list.innerHTML = `<div class="empty-hint">No days planned yet. Open any place and set a Day to add it to your itinerary.</div>`;
    return;
  }
  days.forEach(day => {
    const label = document.createElement('div');
    label.className = 'itinerary-day-label';
    label.textContent = `Day ${day}`;
    list.appendChild(label);
    grouped[day].forEach(p => {
      const cat = CAT_BY_KEY[p.category];
      const div = document.createElement('div');
      div.className = 'place' + (p.visited ? ' visited' : '');
      div.innerHTML = `
        ${p.photo ? `<img class="place-thumb" src="${p.photo}">` : `<span class="place-dot" style="background:var(--${p.category})"></span>`}
        <div class="place-main">
          <span class="place-name">${escapeHtml(p.name)}</span>
          <div class="place-notes">${cat ? cat.label : ''}</div>
        </div>
        ${p.visited ? '<span class="place-visited-tag">Been</span>' : ''}
        <span class="chev">&#8250;</span>`;
      div.addEventListener('click', () => openEditor(p.id));
      list.appendChild(div);
    });
  });
}

/* ---- editor ---- */
function populateCategorySelect(){
  el('f-cat').innerHTML = CATEGORIES.map(c => `<option value="${c.key}">${c.label}</option>`).join('');
}
function updatePhotoPreview(){
  if (pendingPhoto){
    el('photoPreviewWrap').style.display = 'block';
    el('photoPreview').src = pendingPhoto;
    el('photoAddBtn').style.display = 'none';
  } else {
    el('photoPreviewWrap').style.display = 'none';
    el('photoAddBtn').style.display = 'block';
  }
}
function openEditor(id, latlng){
  editingId = id;
  pendingLatLng = latlng || null;
  const isNew = !id;
  el('editorHeading').textContent = isNew ? 'New place' : 'Edit place';
  el('deleteBtn').style.visibility = isNew ? 'hidden' : 'visible';
  let lat = null, lng = null;
  if (isNew){
    el('f-name').value = '';
    el('f-cat').value = activeCategory || CATEGORIES[0].key;
    el('f-visited').value = '0';
    el('f-day').value = '';
    el('f-notes').value = '';
    pendingPhoto = null;
    if (pendingLatLng){ lat = pendingLatLng.lat; lng = pendingLatLng.lng; }
  } else {
    const p = currentTrip.places.find(p => p.id === id);
    el('f-name').value = p.name;
    el('f-cat').value = p.category;
    el('f-visited').value = p.visited ? '1' : '0';
    el('f-day').value = p.day || '';
    el('f-notes').value = p.notes || '';
    pendingPhoto = p.photo || null;
    lat = p.lat; lng = p.lng;
  }
  const dirBtn = el('directionsBtn');
  if (lat != null && lng != null){
    dirBtn.href = directionsUrl(lat, lng);
    dirBtn.style.display = 'block';
  } else {
    dirBtn.style.display = 'none';
  }
  const shareBtn = el('shareBtn');
  if (!isNew && lat != null && lng != null){
    shareBtn.style.display = 'block';
    shareBtn.onclick = () => sharePlace(currentTrip.places.find(pl => pl.id === editingId));
  } else {
    shareBtn.style.display = 'none';
    shareBtn.onclick = null;
  }
  updatePhotoPreview();
  el('f-photo-file').value = '';
  el('editor').classList.add('open');
  setTimeout(() => el('f-name').focus(), 50);
}
function closeEditor(){
  el('editor').classList.remove('open');
  editingId = null;
  pendingLatLng = null;
  pendingPhoto = null;
}
function saveEditor(){
  const name = el('f-name').value.trim();
  if (!name){ el('f-name').focus(); return; }
  const dayVal = el('f-day').value.trim();
  const data = {
    name,
    category: el('f-cat').value,
    visited: el('f-visited').value === '1',
    day: dayVal ? parseInt(dayVal, 10) : null,
    notes: el('f-notes').value.trim(),
    photo: pendingPhoto
  };
  if (editingId){
    Object.assign(currentTrip.places.find(p => p.id === editingId), data);
  } else if (pendingLatLng){
    currentTrip.places.push({ id: uid(), lat: pendingLatLng.lat, lng: pendingLatLng.lng, addedBy: getUserName(), addedAt: Date.now(), ...data });
  }
  saveTrip();
  renderMarkers();
  renderHome();
  if (activeCategory) openCategory(activeCategory);
  if (el('screen-itinerary').classList.contains('active')) renderItinerary();
  closeEditor();
}
function showUndoToast(place){
  lastDeleted = { place };
  clearTimeout(undoTimer);
  el('toastText').textContent = `Deleted "${place.name}"`;
  el('toast').classList.add('show');
  undoTimer = setTimeout(hideToast, 5000);
}
function hideToast(){
  el('toast').classList.remove('show');
  lastDeleted = null;
}
function undoDelete(){
  if (!lastDeleted) return;
  clearTimeout(undoTimer);
  currentTrip.places.push(lastDeleted.place);
  saveTrip();
  renderMarkers();
  renderHome();
  if (activeCategory) openCategory(activeCategory);
  if (el('screen-itinerary').classList.contains('active')) renderItinerary();
  el('toast').classList.remove('show');
  lastDeleted = null;
}
function deletePlace(){
  const place = currentTrip.places.find(p => p.id === editingId);
  if (!place) { closeEditor(); return; }
  currentTrip.places = currentTrip.places.filter(p => p.id !== editingId);
  saveTrip();
  renderMarkers();
  renderHome();
  if (activeCategory) openCategory(activeCategory);
  if (el('screen-itinerary').classList.contains('active')) renderItinerary();
  closeEditor();
  showUndoToast(place);
}

/* ---- trips ---- */
function setTrip(file, definition){
  if (fbRef) { fbRef.off(); fbRef = null; }
  if (fbDatesRef) { fbDatesRef.off(); fbDatesRef = null; }
  clearSearchResults();
  el('search').value = '';
  currentTripFile = file;
  currentTrip = {
    name: definition.name,
    dates: definition.dates || '',
    center: definition.center || [20, 0],
    zoom: definition.zoom || 4,
    bounds: definition.bounds || null,
    searchBounds: definition.searchBounds || definition.bounds || null,
    suggestions: definition.suggestions || {},
    places: [],
    startDate: null,
    endDate: null,
    visibleCategories: loadVisibleCategories(file)
  };
  if (currentTrip.bounds) map.fitBounds(currentTrip.bounds, { maxZoom: 15 });
  else map.setView(currentTrip.center, currentTrip.zoom);
  renderMarkers();
  renderHome();
  fetchWeather();

  if (fbDb){
    fbDatesRef = fbDb.ref('rooms/' + getRoom() + '/trips/' + tripKey(file) + '/dates');
    fbDatesRef.on('value', snap => {
      if (file !== currentTripFile) return;
      // Firebase prunes an object whose fields are all null, so "cleared" and
      // "never set" are indistinguishable here - always treat a missing value
      // as unset rather than resurrecting a stale local cache and pushing it
      // back up, which would silently un-clear dates on a later reload.
      const remote = snap.val();
      currentTrip.startDate = (remote && remote.start) || null;
      currentTrip.endDate = (remote && remote.end) || null;
      localStorage.setItem('tripmap:dates:' + file, JSON.stringify({ start: currentTrip.startDate, end: currentTrip.endDate }));
      renderHome();
    });
  } else {
    const local = loadLocalDates(file);
    currentTrip.startDate = local.start;
    currentTrip.endDate = local.end;
    renderHome();
  }

  if (fbDb){
    fbRef = fbDb.ref('rooms/' + getRoom() + '/trips/' + tripKey(file) + '/places');
    fbRef.on('value', snap => {
      if (file !== currentTripFile) return;
      const remote = snap.val();
      if (Array.isArray(remote)){
        currentTrip.places = remote;
      } else if (remote && typeof remote === 'object'){
        currentTrip.places = Object.values(remote);
      } else {
        currentTrip.places = loadLocalPlaces(file);
        fbRef.set(currentTrip.places);
      }
      migratePlaces(currentTrip.places);
      localStorage.setItem('tripmap:content:' + file, JSON.stringify(currentTrip.places));
      renderMarkers();
      renderHome();
      if (activeCategory && el('screen-category').classList.contains('active')) openCategory(activeCategory);
    });
  } else {
    currentTrip.places = loadLocalPlaces(file);
    migratePlaces(currentTrip.places);
    renderMarkers();
    renderHome();
  }
}
function populateTripSelect(files, activeFile){
  const sel = el('tripSelect');
  sel.innerHTML = '';
  files.forEach(f => {
    const opt = document.createElement('option');
    opt.value = f;
    opt.textContent = f.replace(/\.json$/, '');
    sel.appendChild(opt);
  });
  sel.value = activeFile;
}

async function boot(){
  el('menuFooter').innerHTML = `Trip Map v${APP_VERSION}<br>Designed by George Philippou &middot; Made with AI`;
  populateCategorySelect();
  renderMapLegend();
  initMap();
  initHeroMap();
  const files = await loadTripList();
  const startFile = files[0];
  const definition = await loadTripDefinition(startFile, files);
  populateTripSelect(files, startFile);
  setTrip(startFile, definition);

  el('mapBackBtn').addEventListener('click', () => { stopPlacing(); clearSearchResults(); el('search').value = ''; showScreen('screen-home'); });
  el('mapAddBtn').addEventListener('click', startPlacing);
  el('legendBtn').addEventListener('click', () => el('mapLegend').classList.toggle('show'));
  el('placeCancelBtn').addEventListener('click', stopPlacing);
  el('placeConfirmBtn').addEventListener('click', () => {
    const c = map.getCenter();
    stopPlacing();
    openEditor(null, c);
  });
  el('catBackBtn').addEventListener('click', () => { activeCategory = null; showScreen('screen-home'); });
  el('heroCard').addEventListener('click', () => showScreen('screen-map'));
  el('catSortBtn').addEventListener('click', () => {
    if (!userLatLng){
      locateUser(() => { sortByDistance = true; if (activeCategory) openCategory(activeCategory); });
      return;
    }
    sortByDistance = !sortByDistance;
    if (activeCategory) openCategory(activeCategory);
  });

  el('itineraryItem').addEventListener('click', () => {
    el('menu').classList.remove('open');
    renderItinerary();
    showScreen('screen-itinerary');
  });
  el('itineraryBackBtn').addEventListener('click', () => showScreen('screen-home'));

  el('tripDatesItem').addEventListener('click', () => {
    const startInput = prompt('Trip start date (YYYY-MM-DD), or leave blank to clear:', currentTrip.startDate || '');
    if (startInput === null) return;
    const start = startInput.trim();
    if (start && !/^\d{4}-\d{2}-\d{2}$/.test(start)){ alert('Please use YYYY-MM-DD format.'); return; }
    const endInput = prompt('Trip end date (YYYY-MM-DD), or leave blank for a single day:', currentTrip.endDate || start);
    if (endInput === null) return;
    const end = endInput.trim();
    if (end && !/^\d{4}-\d{2}-\d{2}$/.test(end)){ alert('Please use YYYY-MM-DD format.'); return; }
    currentTrip.startDate = start || null;
    currentTrip.endDate = end || start || null;
    saveDates();
    renderHome();
    el('menu').classList.remove('open');
  });

  el('userNameStatus').textContent = localStorage.getItem(USER_NAME_KEY) || 'Not set';
  el('userNameItem').addEventListener('click', () => {
    const current = localStorage.getItem(USER_NAME_KEY) || '';
    const next = prompt('What should we call you? (shown when you add places)', current);
    if (next === null) return;
    const trimmed = next.trim();
    if (trimmed) localStorage.setItem(USER_NAME_KEY, trimmed);
    el('userNameStatus').textContent = localStorage.getItem(USER_NAME_KEY) || 'Not set';
    el('menu').classList.remove('open');
  });

  el('toastUndoBtn').addEventListener('click', undoDelete);

  el('catSettingsItem').addEventListener('click', () => {
    el('menu').classList.remove('open');
    renderCatSettings();
    showScreen('screen-catsettings');
  });
  el('catSettingsBackBtn').addEventListener('click', () => showScreen('screen-home'));

  el('roomStatus').textContent = fbDb ? getRoom() : 'offline';
  el('roomItem').addEventListener('click', () => {
    const current = getRoom();
    const next = prompt('Sync room code (share this with whoever you want to sync with):', current);
    if (!next || next.trim() === current) return;
    localStorage.setItem(ROOM_KEY, next.trim());
    el('roomStatus').textContent = fbDb ? getRoom() : 'offline';
    setTrip(currentTripFile, currentTrip);
    el('menu').classList.remove('open');
  });

  el('photoAddBtn').addEventListener('click', () => el('f-photo-file').click());
  el('photoRemoveBtn').addEventListener('click', () => {
    pendingPhoto = null;
    el('f-photo-file').value = '';
    updatePhotoPreview();
  });
  el('f-photo-file').addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      pendingPhoto = await resizeImageFile(file, 1000, 0.72);
      updatePhotoPreview();
    } catch (err) {
      alert('Could not read that photo: ' + err.message);
    }
  });

  el('menuBtn').addEventListener('click', () => el('menu').classList.add('open'));
  el('menu').addEventListener('click', e => { if (e.target.id === 'menu') el('menu').classList.remove('open'); });

  el('tripSelect').addEventListener('change', async e => {
    const file = e.target.value;
    const files = await loadTripList();
    const definition = await loadTripDefinition(file, files);
    setTrip(file, definition);
    el('menu').classList.remove('open');
  });

  el('newTripItem').addEventListener('click', async () => {
    const name = prompt('Trip name? (e.g. "Amsterdam", or a whole country like "Japan")');
    if (!name || !name.trim()) return;
    const trimmed = name.trim();
    const file = trimmed.toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.json';
    const files = await loadTripList();

    if (files.includes(file)){
      const definition = await loadTripDefinition(file, files);
      populateTripSelect(files, file);
      setTrip(file, definition);
      el('menu').classList.remove('open');
      alert(`"${definition.name}" already exists — switched to it.`);
      return;
    }

    let center = [20, 0], zoom = 4, bounds = null;
    try {
      const res = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(trimmed));
      const results = await res.json();
      if (results.length){
        const r = results[0];
        center = [parseFloat(r.lat), parseFloat(r.lon)];
        zoom = zoomForPlaceRank(r.place_rank);
        if (Array.isArray(r.boundingbox) && r.boundingbox.length === 4){
          const [south, north, west, east] = r.boundingbox.map(parseFloat);
          const candidateBounds = [[south, west], [north, east]];
          // Some administrative boundaries (e.g. Tokyo prefecture's outlying islands) report a
          // bounding box far larger than the place "feels" like - ignore it when it's an outlier
          // for this rank of place, and fall back to the place_rank-based center+zoom instead.
          if (boundsSpanReasonable(candidateBounds, r.place_rank)) bounds = candidateBounds;
        }
      }
    } catch (err) { /* fall back to default center/zoom */ }

    const definition = { name: trimmed, dates: '', center, zoom, bounds, suggestions: {} };
    localStorage.setItem('tripmap:shell:' + file, JSON.stringify(definition));
    const localTrips = JSON.parse(localStorage.getItem(LOCAL_TRIPS_KEY) || '[]');
    if (!localTrips.includes(file)){ localTrips.push(file); localStorage.setItem(LOCAL_TRIPS_KEY, JSON.stringify(localTrips)); }
    const allFiles = files.includes(file) ? files : [...files, file];
    populateTripSelect(allFiles, file);
    setTrip(file, definition);
    el('menu').classList.remove('open');
  });

  el('saveBtn').addEventListener('click', saveEditor);
  el('cancelBtn').addEventListener('click', closeEditor);
  el('deleteBtn').addEventListener('click', deletePlace);
  el('editor').addEventListener('click', e => { if (e.target.id === 'editor') closeEditor(); });

  el('exportItem').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(currentTrip, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = currentTripFile;
    a.click();
    URL.revokeObjectURL(url);
  });

  el('importItem').addEventListener('click', () => el('importFile').click());
  el('importFile').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        setTrip(currentTripFile, data);
        if (Array.isArray(data.places)){
          currentTrip.places = data.places;
          migratePlaces(currentTrip.places);
          saveTrip();
          renderMarkers();
        }
        if (Array.isArray(data.visibleCategories) && data.visibleCategories.length){
          currentTrip.visibleCategories = data.visibleCategories;
          saveVisibleCategories(currentTripFile, currentTrip.visibleCategories);
        }
        renderHome();
        el('menu').classList.remove('open');
      } catch (err) {
        alert('Could not read that file: ' + err.message);
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  el('search').addEventListener('input', e => {
    clearTimeout(searchDebounceTimer);
    const q = e.target.value.trim();
    searchDebounceTimer = setTimeout(() => runSearch(q), 350);
  });
  el('search').addEventListener('paste', () => {
    setTimeout(() => {
      const q = el('search').value.trim();
      const parsed = parseLocationInput(q);
      if (parsed && (parsed.lat != null || parsed.unresolved)){
        clearTimeout(searchDebounceTimer);
        handleParsedLocation(parsed);
      }
    }, 0);
  });
  el('search').addEventListener('keydown', async e => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    clearTimeout(searchDebounceTimer);
    const q = e.target.value.trim();
    if (!q) return;
    const parsed = parseLocationInput(q);
    if (handleParsedLocation(parsed)) return;
    if (lastSearchQuery === q && lastSearchResults.length){
      selectSearchResult(lastSearchResults[0]);
      return;
    }
    await runSearch(q);
    if (lastSearchResults.length) selectSearchResult(lastSearchResults[0]);
    else alert('No results for "' + q + '"');
  });

  handleSharedLaunch();
}

boot();
</script>
