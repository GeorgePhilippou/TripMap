<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Trip Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F0E2; --surface:#FAF8EF; --surface2:#EFEBDC; --border:#DBD5C0;
    --text:#262A1C; --muted:#6E7260; --accent:#5D7350; --accent-ink:#F6F5EA;
    --sight:#4F6B44;      --sight-soft:#DCE4CC;
    --food:#8A6A28;       --food-soft:#F0E3BE;
    --beach:#396F6C;      --beach-soft:#D3E6E3;
    --historical:#8A6A3E; --historical-soft:#EFE6D0;
    --fruit:#B25A34;      --fruit-soft:#F5DED0;
    --shops:#8A4F6E;      --shops-soft:#F0DCE8;
    --general:#6E7260;    --general-soft:#E7E3D2;
    --activity:#6E7A2E;   --activity-soft:#E7EAC9;
    --stays:#93544A;      --stays-soft:#F0DAD3;
    --airport:#4A5E8A;    --airport-soft:#DBE2F0;
    --hike:#65588F;       --hike-soft:#E1DCF0;
    --overlay:rgba(250,248,239,.85);
    --danger-bg:#F5DEDB; --danger-border:#E0B7B1; --danger-text:#9A3E33;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;overscroll-behavior:none;}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; justify-content:center;
    height:100vh; height:100dvh; overflow:hidden;
  }
  #app{ width:100%; max-width:480px; height:100%; display:flex; flex-direction:column; position:relative;
    border-left:1px solid var(--border); border-right:1px solid var(--border); overflow:hidden; }

  @media (min-width:760px){
    body{ align-items:center; background:var(--surface2); }
    #app{
      max-width:640px; height:calc(100dvh - 64px); margin:32px 0;
      border:1px solid var(--border); border-radius:20px;
      box-shadow:0 24px 60px rgba(0,0,0,.14);
    }
    #editor-box{ max-width:640px; border-radius:18px; border-bottom:1px solid var(--border); margin-bottom:32px; }
    #editor{ align-items:center; }
    #menu-box{ max-width:600px; }
  }

  /* ---- top bar (shared) ---- */
  .topbar{ display:flex; align-items:center; justify-content:flex-end; padding:calc(10px + env(safe-area-inset-top)) 18px 0; flex-shrink:0; }
  .icon-btn{
    background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:10px;
    width:34px; height:34px; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:hover{ border-color:var(--accent); }

  /* ---- home screen ---- */
  .screen{ display:none; flex-direction:column; flex:1; min-height:0; overflow-y:auto; padding-bottom:16px; }
  #screen-home{ overflow:hidden; padding-bottom:calc(26px + env(safe-area-inset-bottom)); }
  .screen.active{ display:flex; }
  .eyebrow{ font-size:11px; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; margin-bottom:4px; }
  h1.trip-title{ font-family:'Fraunces',serif; font-weight:500; font-size:clamp(22px,7vh,30px); margin:0 0 2px; letter-spacing:-.01em; line-height:1.1; }
  .trip-sub{ color:var(--muted); font-size:13px; }
  .home-header{ padding:6px 18px 0; flex-shrink:0; }

  .hero{
    margin:12px 18px 0; border-radius:16px; overflow:hidden; border:1px solid var(--border);
    position:relative; height:clamp(64px,11vh,96px); background:linear-gradient(160deg,var(--surface2),var(--surface));
    display:flex; align-items:flex-end; padding:12px; cursor:pointer; flex-shrink:0;
  }
  .hero-map{ position:absolute; inset:0; z-index:0; pointer-events:none; }
  .hero-photo{ position:absolute; inset:0; z-index:0; background-size:cover; background-position:center; display:none; }
  .hero-pill{ position:relative; z-index:1; background:var(--overlay); border:1px solid var(--border); border-radius:10px; padding:7px 11px; font-size:13px; }
  .hero-pill b{ font-weight:600; }
  .hero-pill .count{ color:var(--muted); font-size:11px; }
  .hero-empty{ color:var(--muted); font-size:13px; }

  .grid{ display:grid; grid-template-columns:1fr 1fr; grid-template-rows:repeat(3,minmax(0,1fr)); gap:8px; margin:10px 18px 0; flex:1; min-height:0; }
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:10px 14px; display:flex; flex-direction:column; justify-content:center; gap:6px; cursor:pointer; min-height:0;
  }
  .card:hover{ border-color:var(--accent); }
  .cat-icon{ width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0; }
  .card-title{ font-size:14px; font-weight:600; line-height:1.15; }
  .card-count{ font-size:12px; color:var(--muted); line-height:1.15; }
  .chev{ color:var(--muted); font-size:18px; }

  .primary-btn{
    margin:12px 18px 0; background:var(--accent); color:var(--accent-ink); border:none;
    border-radius:12px; padding:13px; font-weight:600; font-size:14px; font-family:inherit; cursor:pointer; flex-shrink:0;
  }
  .primary-btn:hover{ filter:brightness(1.05); }

  /* ---- category / list screen ---- */
  .cat-header{ display:flex; align-items:center; gap:10px; padding:calc(10px + env(safe-area-inset-top)) 18px 0; flex-shrink:0; }
  .cat-header h2{ font-family:'Fraunces',serif; font-weight:500; font-size:22px; margin:0; flex:1; }
  .place-list{ margin-top:8px; }
  .place{ padding:14px 18px; border-bottom:1px solid var(--border); cursor:pointer; display:flex; align-items:center; gap:12px; }
  .place:hover{ background:var(--surface); }
  .place.visited .place-name{ text-decoration:line-through; color:var(--muted); }
  .place-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .place-thumb{ width:36px; height:36px; border-radius:8px; object-fit:cover; flex-shrink:0; }
  .place-name{ font-weight:500; font-size:14px; flex:1; }
  .place-visited-tag{ font-size:11px; color:var(--muted); }
  .empty-hint{ padding:24px 18px; color:var(--muted); font-size:13px; line-height:1.6; text-align:center; }

  .suggest-label{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; padding:18px 18px 6px; }
  .suggest-row{ display:flex; align-items:center; gap:10px; padding:10px 18px; border-bottom:1px solid var(--border); }
  .suggest-name{ flex:1; font-size:14px; }
  .suggest-actions{ display:flex; gap:6px; flex-shrink:0; }
  .suggest-btn{
    width:30px; height:30px; border-radius:8px; border:1px solid var(--border); background:var(--surface2);
    color:var(--text); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:14px;
  }
  .suggest-btn:hover{ border-color:var(--accent); }
  .suggest-btn.been{ color:var(--accent); border-color:var(--accent); }

  /* ---- category settings screen ---- */
  .settings-list{ overflow-y:auto; }
  .settings-row{ display:flex; align-items:center; gap:12px; padding:12px 18px; border-bottom:1px solid var(--border); }
  .settings-row .cat-icon{ width:28px; height:28px; font-size:13px; }
  .settings-label{ flex:1; font-size:14px; }
  .toggle{ width:40px; height:24px; border-radius:12px; background:var(--surface2); border:1px solid var(--border); position:relative; cursor:pointer; flex-shrink:0; }
  .toggle.on{ background:var(--accent); border-color:var(--accent); }
  .toggle-knob{ position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:var(--text); transition:left .15s; }
  .toggle.on .toggle-knob{ left:18px; background:var(--accent-ink); }

  /* ---- map screen ---- */
  #screen-map{ padding-bottom:0; }
  #mapWrap{ flex:1; position:relative; min-height:0; display:flex; flex-direction:column; }
  #map{ flex:1; }
  .map-topbar{ position:absolute; top:calc(14px + env(safe-area-inset-top)); left:14px; right:14px; z-index:500; display:flex; justify-content:space-between; }
  .map-topbar .icon-btn{
    background:var(--accent); color:var(--accent-ink); border:none;
    box-shadow:0 2px 8px rgba(0,0,0,.18);
  }
  .search-wrap{ position:absolute; top:calc(60px + env(safe-area-inset-top)); left:14px; right:14px; z-index:500; }
  .search-wrap input{
    width:100%; background:var(--overlay); backdrop-filter:blur(6px); color:var(--text);
    border:1px solid var(--border); border-radius:10px; padding:10px 12px; font-size:13px; font-family:inherit;
  }
  .pin-crosshair{
    position:absolute; top:50%; left:50%; margin-left:-14px; margin-top:-32px; z-index:600;
    display:none; pointer-events:none;
  }
  .pin-crosshair.show{ display:block; }
  .pin-crosshair-icon{
    width:26px; height:26px; border-radius:50% 50% 50% 0; transform:rotate(-45deg);
    background:var(--accent); border:2px solid rgba(0,0,0,.4); box-shadow:0 3px 8px rgba(0,0,0,.4);
  }
  .place-confirm-bar{
    position:absolute; left:14px; right:14px; bottom:calc(14px + env(safe-area-inset-bottom));
    z-index:600; display:none; gap:8px;
  }
  .place-confirm-bar.show{ display:flex; }
  .place-confirm-bar .btn{ flex:1; }
  .place-confirm-bar .btn-primary{ flex:2; }
  .version-tag{
    position:absolute; bottom:6px; left:10px; font-size:10px; color:var(--muted); opacity:.55;
    z-index:10; pointer-events:none;
  }


  /* ---- editor bottom sheet ---- */
  #editor{ position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:flex-end; justify-content:center; z-index:1000; }
  #editor.open{ display:flex; }
  #editor-box{
    background:var(--surface); border:1px solid var(--border); border-bottom:none;
    border-radius:18px 18px 0 0; padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    width:100%; max-width:480px; display:flex; flex-direction:column; gap:12px;
  }
  #editor-box h3{ font-family:'Fraunces',serif; font-weight:500; margin:0 0 2px; font-size:19px; }
  #editor-box label{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  #editor-box input, #editor-box select, #editor-box textarea{
    width:100%; background:var(--surface2); color:var(--text); border:1px solid var(--border);
    border-radius:8px; padding:10px; font-size:14px; font-family:inherit; margin-top:4px;
  }
  #editor-box textarea{ min-height:64px; resize:vertical; }
  .editor-row{ display:flex; gap:10px; }
  .editor-row > div{ flex:1; }
  .editor-actions{ display:flex; justify-content:space-between; margin-top:4px; gap:8px; }
  button{ font-family:inherit; }
  .btn{ background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:10px 14px; font-size:13px; cursor:pointer; }
  .btn:hover{ border-color:var(--accent); }
  .btn-danger{ background:var(--danger-bg); border-color:var(--danger-border); color:var(--danger-text); }
  .btn-primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600; }
  .photo-preview-wrap{ position:relative; width:100%; margin-top:4px; }
  .photo-preview{ width:100%; max-height:160px; object-fit:cover; border-radius:8px; display:block; }
  .photo-remove{
    position:absolute; top:6px; right:6px; width:26px; height:26px; border-radius:50%;
    background:rgba(0,0,0,.6); color:#fff; border:none; cursor:pointer; font-size:12px;
  }
  .photo-add-btn{
    margin-top:4px; width:100%; background:var(--surface2); color:var(--text);
    border:1px dashed var(--border); border-radius:8px; padding:10px; font-size:13px; cursor:pointer;
  }
  .photo-add-btn:hover{ border-color:var(--accent); }

  /* ---- trip menu ---- */
  #menu{ position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:flex-start; justify-content:center; z-index:1000; }
  #menu.open{ display:flex; }
  #menu-box{
    background:var(--surface); border:1px solid var(--border); border-radius:14px; margin-top:64px;
    padding:10px; width:calc(100% - 36px); max-width:440px; display:flex; flex-direction:column; gap:2px;
  }
  #menu-box .menu-item{
    padding:12px 14px; border-radius:8px; cursor:pointer; font-size:14px; display:flex; justify-content:space-between; align-items:center;
  }
  #menu-box .menu-item:hover{ background:var(--surface2); }
  #roomStatus{ font-size:12px; color:var(--muted); max-width:140px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #menu-box .menu-label{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; padding:10px 14px 2px; }
  #menu-box select{ width:100%; background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:10px; font-size:14px; font-family:inherit; }

  .leaflet-div-icon{ background:transparent; border:none; }
  .pin{ width:18px; height:18px; border-radius:50% 50% 50% 0; transform:rotate(-45deg);
    border:2px solid rgba(0,0,0,.4); box-shadow:0 1px 3px rgba(0,0,0,.5); }
  input[type=file]{ display:none; }
</style>
</head>
<body>
<div id="app">
  <div id="versionTag" class="version-tag"></div>

  <!-- HOME -->
  <section id="screen-home" class="screen active">
    <div class="topbar">
      <button class="icon-btn" id="menuBtn">&#8942;</button>
    </div>
    <div class="home-header">
      <div class="eyebrow" id="tripDates">Trip</div>
      <h1 class="trip-title" id="tripName">Trip</h1>
      <div class="trip-sub" id="tripSummary">0 places saved</div>
    </div>

    <div class="hero" id="heroCard">
      <div id="heroMap" class="hero-map"></div>
      <div id="heroPhoto" class="hero-photo"></div>
      <div class="hero-pill" id="heroPill"><span class="hero-empty">No places yet — tap the map to start</span></div>
    </div>

    <div class="grid" id="categoryGrid"></div>

    <button class="primary-btn" id="viewMapBtn">View full map</button>
  </section>

  <!-- CATEGORY LIST -->
  <section id="screen-category" class="screen">
    <div class="cat-header">
      <button class="icon-btn" id="catBackBtn">&#8592;</button>
      <h2 id="catTitle">Category</h2>
    </div>
    <div class="place-list" id="catList"></div>
  </section>

  <!-- FULL MAP -->
  <section id="screen-map" class="screen">
    <div id="mapWrap">
      <div class="map-topbar">
        <button class="icon-btn" id="mapBackBtn">&#8592;</button>
        <button class="icon-btn" id="mapAddBtn">+</button>
      </div>
      <div class="search-wrap">
        <input id="search" type="text" placeholder="Search a place & press Enter…">
      </div>
      <div id="pinCrosshair" class="pin-crosshair"><div class="pin-crosshair-icon"></div></div>
      <div id="placeConfirmBar" class="place-confirm-bar">
        <button class="btn" id="placeCancelBtn">Cancel</button>
        <button class="btn btn-primary" id="placeConfirmBtn">Add place here</button>
      </div>
      <div id="map"></div>
    </div>
  </section>

  <!-- CATEGORY SETTINGS -->
  <section id="screen-catsettings" class="screen">
    <div class="cat-header">
      <button class="icon-btn" id="catSettingsBackBtn">&#8592;</button>
      <h2>Homepage categories</h2>
    </div>
    <div class="settings-list" id="catSettingsList"></div>
  </section>

</div>

<!-- EDITOR -->
<div id="editor">
  <div id="editor-box">
    <h3 id="editorHeading">New place</h3>
    <div>
      <label>Name</label>
      <input id="f-name" type="text" placeholder="e.g. Nissi Beach">
    </div>
    <div class="editor-row">
      <div>
        <label>Category</label>
        <select id="f-cat"></select>
      </div>
      <div>
        <label>Status</label>
        <select id="f-visited">
          <option value="0">Not yet</option>
          <option value="1">Been</option>
        </select>
      </div>
    </div>
    <div>
      <label>Photo</label>
      <div id="photoPreviewWrap" class="photo-preview-wrap" style="display:none;">
        <img id="photoPreview" class="photo-preview">
        <button type="button" class="photo-remove" id="photoRemoveBtn">&#10005;</button>
      </div>
      <button type="button" class="photo-add-btn" id="photoAddBtn">Add photo</button>
      <input id="f-photo-file" type="file" accept="image/*" capture="environment">
    </div>
    <div>
      <label>Notes</label>
      <textarea id="f-notes" placeholder="Opening hours, why you want to go, tips…"></textarea>
    </div>
    <div class="editor-actions">
      <button class="btn btn-danger" id="deleteBtn">Delete</button>
      <div style="display:flex;gap:8px;">
        <button class="btn" id="cancelBtn">Cancel</button>
        <button class="btn btn-primary" id="saveBtn">Save</button>
      </div>
    </div>
  </div>
</div>

<!-- TRIP MENU -->
<div id="menu">
  <div id="menu-box">
    <div class="menu-label">Trip</div>
    <div style="padding:0 14px 10px;"><select id="tripSelect"></select></div>
    <div class="menu-item" id="newTripItem"><span>New trip</span><span>+</span></div>
    <div class="menu-item" id="catSettingsItem"><span>Homepage categories</span><span>&#8250;</span></div>
    <div class="menu-label">Sharing</div>
    <div class="menu-item" id="roomItem"><span>Sync room</span><span id="roomStatus">&#8250;</span></div>
    <div class="menu-label">Data</div>
    <div class="menu-item" id="exportItem"><span>Export JSON</span><span>&#8595;</span></div>
    <div class="menu-item" id="importItem"><span>Import JSON</span><span>&#8593;</span></div>
    <input id="importFile" type="file" accept="application/json">
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script>
const APP_VERSION = '1.5.0';

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDMggOyb4S3cRiV05mfh8l1Yi7Z6iqyDLA",
  authDomain: "tripmap-48cc1.firebaseapp.com",
  databaseURL: "https://tripmap-48cc1-default-rtdb.europe-west1.firebasedatabase.app",

  storageBucket: "tripmap-48cc1.firebasestorage.app",
  messagingSenderId: "313288649936",
  appId: "1:313288649936:web:af6c708ab7765372c182d5"
};
const DEFAULT_ROOM = 'philippou-megan-8x4q';
const ROOM_KEY = 'tripmap:room';
let fbApp, fbDb, fbRef;
try {
  fbApp = firebase.initializeApp(FIREBASE_CONFIG);
  fbDb = firebase.database();
} catch (e) { console.error('Firebase init failed', e); }
function getRoom(){ return localStorage.getItem(ROOM_KEY) || DEFAULT_ROOM; }

function svgIcon(paths){
  return `<svg viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${paths}</svg>`;
}
const CATEGORIES = [
  { key:'sight',      label:'Sights',           icon:svgIcon('<path d="M2 10 Q10 3 18 10 Q10 17 2 10 Z"/><circle cx="10" cy="10" r="2.2"/>') },
  { key:'food',       label:'Food & Drink',      icon:svgIcon('<path d="M6 2v4a2 2 0 0 0 4 0V2M8 6v12"/><path d="M14 2v6a2 2 0 0 0 2 2M14 2v6M14 10v8"/>') },
  { key:'beach',      label:'Beaches',           icon:svgIcon('<path d="M2 7c2-1.5 4 1.5 6 0s4 1.5 6 0 3-1.2 4-1M2 12c2-1.5 4 1.5 6 0s4 1.5 6 0 3-1.2 4-1M2 17c2-1.5 4 1.5 6 0s4 1.5 6 0 3-1.2 4-1"/>') },

  { key:'fruit',      label:'Fruit',             icon:svgIcon('<path d="M10 8c-3-3-8-1-8 4 0 4 3 7 6 7 1 0 1.5-.5 2-.5s1 .5 2 .5c3 0 6-3 6-7 0-3.5-3-5.5-6-4"/><path d="M10 8V5c0-1.5 1-2 2-2"/>') },
  { key:'shops',      label:'Shops',             icon:svgIcon('<path d="M5 7h10l1 11H4L5 7Z"/><path d="M7 7a3 3 0 0 1 6 0"/>') },
  { key:'activity',   label:'Activity',          icon:svgIcon('<path d="M5 2v16"/><path d="M5 3h9l-2.5 3L14 9H5"/>') },
  { key:'stays',      label:'Stays',             icon:svgIcon('<path d="M2 16V6a1 1 0 0 1 1-1h1v6M2 12h16v4M6 11a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v1H6v-1Z"/><path d="M18 16v2M2 16v2"/>') },
  { key:'airport',    label:'Airport & Travel',  icon:svgIcon('<path d="M10 2v6M10 8 3 12v2l7-2v4l-2 2v1l3-1 3 1v-1l-2-2v-4l7 2v-2l-7-4-.001-6Z"/>') },
  { key:'general',    label:'General',           icon:svgIcon('<path d="M5 2h10v16l-5-4-5 4V2Z"/>') },
  { key:'hike',       label:'Hikes',             icon:svgIcon('<path d="M2 17 8 6l3 5 2-3 5 9H2Z"/>') },
];
const CAT_BY_KEY = Object.fromEntries(CATEGORIES.map(c => [c.key, c]));
const DEFAULT_VISIBLE_CATEGORIES = CATEGORIES.filter(c => c.key !== 'hike').map(c => c.key);
const CATEGORY_MIGRATIONS = { hotel:'stays', other:'general' };
const STORAGE_PREFIX = 'tripmap:';

let map, markers = {}, currentTrip = null, currentTripFile = null, editingId = null, pendingLatLng = null;
let heroMap, heroMarkersLayer;
let activeCategory = null, pendingPhoto = null, placing = false;

const el = id => document.getElementById(id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const storageKey = file => STORAGE_PREFIX + file;
const escapeHtml = s => (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function loadTripList(){
  return fetch('trips/index.json').then(r => r.json()).catch(() => ['cyprus.json']);
}
function loadTrip(file){
  const saved = localStorage.getItem(storageKey(file));
  if (saved) return Promise.resolve(JSON.parse(saved));
  return fetch('trips/' + file).then(r => r.json());
}
function tripKey(file){ return (file || '').replace(/\.json$/, ''); }
function saveTrip(){
  localStorage.setItem(storageKey(currentTripFile), JSON.stringify(currentTrip));
  if (fbDb){
    fbDb.ref('rooms/' + getRoom() + '/trips/' + tripKey(currentTripFile)).set({
      places: currentTrip.places,
      visibleCategories: currentTrip.visibleCategories
    });
  }
}
function migrateTrip(trip){
  let changed = false;
  trip.places.forEach(p => {
    if (CATEGORY_MIGRATIONS[p.category]){ p.category = CATEGORY_MIGRATIONS[p.category]; changed = true; }
  });
  if (!Array.isArray(trip.visibleCategories)){
    trip.visibleCategories = DEFAULT_VISIBLE_CATEGORIES.slice();
    changed = true;
  }
  return changed;
}
function resizeImageFile(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim){ height = Math.round(height * maxDim / width); width = maxDim; }
        else if (height > maxDim){ width = Math.round(width * maxDim / height); height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  el(id).classList.add('active');
  if (id === 'screen-map') setTimeout(() => map.invalidateSize(), 50);
}

/* ---- map ---- */
const TILE_URL = 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png';
const TILE_ATTRIBUTION = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>';

function initMap(){
  map = L.map('map', { zoomControl: false });
  L.control.zoom({ position: 'bottomright' }).addTo(map);
  L.tileLayer(TILE_URL, { maxZoom: 20, attribution: TILE_ATTRIBUTION }).addTo(map);
  map.on('click', e => { if (!placing) openEditor(null, e.latlng); });
}
function initHeroMap(){
  heroMap = L.map('heroMap', {
    zoomControl: false, attributionControl: false, dragging: false, scrollWheelZoom: false,
    doubleClickZoom: false, boxZoom: false, keyboard: false, touchZoom: false, tap: false, fadeAnimation: false
  });
  L.tileLayer(TILE_URL, { maxZoom: 20 }).addTo(heroMap);
  heroMarkersLayer = L.layerGroup().addTo(heroMap);
}
function updateHeroMap(){
  if (!heroMap) return;
  heroMarkersLayer.clearLayers();
  const places = currentTrip.places;
  if (places.length){
    places.forEach(p => {
      const color = getComputedStyle(document.documentElement).getPropertyValue('--' + p.category).trim() || '#6E7260';
      L.circleMarker([p.lat, p.lng], { radius: 5, color: '#FAF8EF', weight: 1.5, fillColor: color, fillOpacity: 1 }).addTo(heroMarkersLayer);
    });
    const bounds = L.latLngBounds(places.map(p => [p.lat, p.lng]));
    heroMap.fitBounds(bounds.pad(0.35), { animate: false, maxZoom: 13 });
  } else {
    heroMap.setView(currentTrip.center || [20, 0], Math.max((currentTrip.zoom || 4) - 1, 2), { animate: false });
  }
  setTimeout(() => heroMap.invalidateSize(), 0);
}
function startPlacing(){
  placing = true;
  el('pinCrosshair').classList.add('show');
  el('placeConfirmBar').classList.add('show');
  el('mapAddBtn').style.display = 'none';
  el('search').closest('.search-wrap').style.display = 'none';
  const zoomCtrl = document.querySelector('#map .leaflet-control-zoom');
  if (zoomCtrl) zoomCtrl.style.display = 'none';
}
function stopPlacing(){
  placing = false;
  el('pinCrosshair').classList.remove('show');
  el('placeConfirmBar').classList.remove('show');
  el('mapAddBtn').style.display = 'flex';
  el('search').closest('.search-wrap').style.display = 'block';
  const zoomCtrl = document.querySelector('#map .leaflet-control-zoom');
  if (zoomCtrl) zoomCtrl.style.display = '';
}
function pinIcon(cat){
  const color = getComputedStyle(document.documentElement).getPropertyValue('--' + cat).trim() || '#A39E97';
  return L.divIcon({ className:'leaflet-div-icon', html:`<div class="pin" style="background:${color}"></div>`, iconSize:[18,18], iconAnchor:[9,16] });
}
function renderMarkers(){
  Object.values(markers).forEach(m => map.removeLayer(m));
  markers = {};
  currentTrip.places.forEach(p => {
    const m = L.marker([p.lat, p.lng], { icon: pinIcon(p.category) }).addTo(map);
    const thumb = p.photo ? `<img src="${p.photo}" style="width:100%;max-width:180px;height:90px;object-fit:cover;border-radius:6px;margin-bottom:6px;display:block;">` : '';
    m.bindPopup(`${thumb}<strong>${escapeHtml(p.name)}</strong>`);
    m.on('click', () => openEditor(p.id));
    markers[p.id] = m;
  });
}

/* ---- home ---- */
function renderHome(){
  el('tripName').textContent = currentTrip.name || 'Trip';
  el('tripDates').textContent = currentTrip.dates || 'Trip';
  const total = currentTrip.places.length;
  const visited = currentTrip.places.filter(p => p.visited).length;
  el('tripSummary').textContent = total
    ? `${total} place${total===1?'':'s'} saved · ${visited} visited`
    : 'No places yet';

  const next = currentTrip.places.find(p => !p.visited);
  const heroPhoto = el('heroPhoto');
  if (next && next.photo){
    heroPhoto.style.backgroundImage = `linear-gradient(160deg, rgba(0,0,0,.1), rgba(0,0,0,.55)), url(${next.photo})`;
    heroPhoto.style.display = 'block';
  } else {
    heroPhoto.style.display = 'none';
    updateHeroMap();
  }
  if (next){
    el('heroPill').innerHTML = `<b>${escapeHtml(next.name)}</b><div class="count">Next up</div>`;
  } else {
    el('heroPill').innerHTML = total
      ? `<span class="hero-empty">All caught up — everything visited</span>`
      : `<span class="hero-empty">No places yet — tap the map to start</span>`;
  }

  const visibleCats = CATEGORIES.filter(c => currentTrip.visibleCategories.includes(c.key));
  const grid = el('categoryGrid');
  grid.innerHTML = '';
  if (!visibleCats.length){
    grid.style.gridTemplateRows = '';
    grid.innerHTML = `<div class="empty-hint" style="grid-column:span 2;">No categories shown. Turn some on from the menu &rarr; Homepage categories.</div>`;
    return;
  }
  grid.style.gridTemplateRows = `repeat(${Math.ceil(visibleCats.length / 2)}, minmax(0,1fr))`;
  visibleCats.forEach(c => {
    const count = currentTrip.places.filter(p => p.category === c.key).length;
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="cat-icon" style="background:var(--${c.key}-soft);color:var(--${c.key})">${c.icon}</div>
      <div class="card-title">${c.label}</div>
      <div class="card-count">${count} place${count===1?'':'s'}</div>`;
    card.addEventListener('click', () => openCategory(c.key));
    grid.appendChild(card);
  });
}

function renderCatSettings(){
  const list = el('catSettingsList');
  list.innerHTML = '';
  CATEGORIES.forEach(c => {
    const visible = currentTrip.visibleCategories.includes(c.key);
    const row = document.createElement('div');
    row.className = 'settings-row';
    row.innerHTML = `
      <div class="cat-icon" style="background:var(--${c.key}-soft);color:var(--${c.key})">${c.icon}</div>
      <div class="settings-label">${c.label}</div>
      <div class="toggle ${visible ? 'on' : ''}"><div class="toggle-knob"></div></div>`;
    row.querySelector('.toggle').addEventListener('click', () => toggleCategoryVisible(c.key));
    list.appendChild(row);
  });
}
function toggleCategoryVisible(key){
  const idx = currentTrip.visibleCategories.indexOf(key);
  if (idx >= 0) currentTrip.visibleCategories.splice(idx, 1);
  else currentTrip.visibleCategories.push(key);
  saveTrip();
  renderCatSettings();
  renderHome();
}

/* ---- category list ---- */
function openCategory(key){
  activeCategory = key;
  const cat = CAT_BY_KEY[key];
  el('catTitle').textContent = cat.label;
  const places = currentTrip.places.filter(p => p.category === key);
  const list = el('catList');
  list.innerHTML = '';
  if (!places.length){
    list.innerHTML = `<div class="empty-hint">No ${cat.label.toLowerCase()} yet. Add one from the map, or pick a suggestion below.</div>`;
  } else {
    places.forEach(p => {
      const div = document.createElement('div');
      div.className = 'place' + (p.visited ? ' visited' : '');
      div.innerHTML = `
        ${p.photo ? `<img class="place-thumb" src="${p.photo}">` : `<span class="place-dot" style="background:var(--${p.category})"></span>`}
        <span class="place-name">${escapeHtml(p.name)}</span>
        ${p.visited ? '<span class="place-visited-tag">Been</span>' : ''}`;
      div.addEventListener('click', () => openEditor(p.id));
      list.appendChild(div);
    });
  }

  const suggestions = (currentTrip.suggestions && currentTrip.suggestions[key]) || [];
  const addedIds = new Set(currentTrip.places.map(p => p.fromSuggestion).filter(Boolean));
  const remaining = suggestions.filter(s => !addedIds.has(s.id));
  if (remaining.length){
    const label = document.createElement('div');
    label.className = 'suggest-label';
    label.textContent = 'Suggested';
    list.appendChild(label);
    remaining.forEach(s => {
      const row = document.createElement('div');
      row.className = 'suggest-row';
      row.innerHTML = `
        <span class="suggest-name">${escapeHtml(s.name)}</span>
        <div class="suggest-actions">
          <button class="suggest-btn been" title="Mark as been">&#10003;</button>
          <button class="suggest-btn" title="Add to want-to-go">+</button>
        </div>`;
      row.querySelector('.been').addEventListener('click', () => quickAddSuggestion(s, key, true));
      row.querySelector('.suggest-actions > :last-child').addEventListener('click', () => quickAddSuggestion(s, key, false));
      list.appendChild(row);
    });
  }

  showScreen('screen-category');
}
function quickAddSuggestion(s, key, visited){
  currentTrip.places.push({
    id: uid(), lat: s.lat, lng: s.lng, name: s.name, category: key,
    visited, notes: '', photo: null, fromSuggestion: s.id
  });
  saveTrip();
  renderMarkers();
  renderHome();
  openCategory(key);
}

/* ---- editor ---- */
function populateCategorySelect(){
  el('f-cat').innerHTML = CATEGORIES.map(c => `<option value="${c.key}">${c.label}</option>`).join('');
}
function updatePhotoPreview(){
  if (pendingPhoto){
    el('photoPreviewWrap').style.display = 'block';
    el('photoPreview').src = pendingPhoto;
    el('photoAddBtn').style.display = 'none';
  } else {
    el('photoPreviewWrap').style.display = 'none';
    el('photoAddBtn').style.display = 'block';
  }
}
function openEditor(id, latlng){
  editingId = id;
  pendingLatLng = latlng || null;
  const isNew = !id;
  el('editorHeading').textContent = isNew ? 'New place' : 'Edit place';
  el('deleteBtn').style.visibility = isNew ? 'hidden' : 'visible';
  if (isNew){
    el('f-name').value = '';
    el('f-cat').value = activeCategory || CATEGORIES[0].key;
    el('f-visited').value = '0';
    el('f-notes').value = '';
    pendingPhoto = null;
  } else {
    const p = currentTrip.places.find(p => p.id === id);
    el('f-name').value = p.name;
    el('f-cat').value = p.category;
    el('f-visited').value = p.visited ? '1' : '0';
    el('f-notes').value = p.notes || '';
    pendingPhoto = p.photo || null;
  }
  updatePhotoPreview();
  el('f-photo-file').value = '';
  el('editor').classList.add('open');
  setTimeout(() => el('f-name').focus(), 50);
}
function closeEditor(){
  el('editor').classList.remove('open');
  editingId = null;
  pendingLatLng = null;
  pendingPhoto = null;
}
function saveEditor(){
  const name = el('f-name').value.trim();
  if (!name){ el('f-name').focus(); return; }
  const data = {
    name,
    category: el('f-cat').value,
    visited: el('f-visited').value === '1',
    notes: el('f-notes').value.trim(),
    photo: pendingPhoto
  };
  if (editingId){
    Object.assign(currentTrip.places.find(p => p.id === editingId), data);
  } else if (pendingLatLng){
    currentTrip.places.push({ id: uid(), lat: pendingLatLng.lat, lng: pendingLatLng.lng, ...data });
  }
  saveTrip();
  renderMarkers();
  renderHome();
  if (activeCategory) openCategory(activeCategory);
  closeEditor();
}
function deletePlace(){
  currentTrip.places = currentTrip.places.filter(p => p.id !== editingId);
  saveTrip();
  renderMarkers();
  renderHome();
  if (activeCategory) openCategory(activeCategory);
  closeEditor();
}

/* ---- trips ---- */
function setTrip(file, data){
  if (fbRef) { fbRef.off(); fbRef = null; }
  currentTripFile = file;
  currentTrip = data;
  migrateTrip(currentTrip);
  map.setView(data.center || [20,0], data.zoom || 4);
  renderMarkers();
  renderHome();

  if (fbDb){
    fbRef = fbDb.ref('rooms/' + getRoom() + '/trips/' + tripKey(file));
    fbRef.on('value', snap => {
      if (file !== currentTripFile) return;
      const remote = snap.val();
      if (remote){
        currentTrip.places = Array.isArray(remote.places) ? remote.places : [];
        currentTrip.visibleCategories = (Array.isArray(remote.visibleCategories) && remote.visibleCategories.length)
          ? remote.visibleCategories : DEFAULT_VISIBLE_CATEGORIES.slice();
        migrateTrip(currentTrip);
        localStorage.setItem(storageKey(currentTripFile), JSON.stringify(currentTrip));
      } else {
        fbRef.set({ places: currentTrip.places, visibleCategories: currentTrip.visibleCategories });
      }
      renderMarkers();
      renderHome();
      if (activeCategory && el('screen-category').classList.contains('active')) openCategory(activeCategory);
    });
  } else {
    localStorage.setItem(storageKey(currentTripFile), JSON.stringify(currentTrip));
  }
}
function populateTripSelect(files, activeFile){
  const sel = el('tripSelect');
  sel.innerHTML = '';
  files.forEach(f => {
    const opt = document.createElement('option');
    opt.value = f;
    opt.textContent = f.replace(/\.json$/, '');
    sel.appendChild(opt);
  });
  sel.value = activeFile;
}

async function boot(){
  el('versionTag').textContent = 'v' + APP_VERSION;
  populateCategorySelect();
  initMap();
  initHeroMap();
  const files = await loadTripList();
  const startFile = files[0];
  const data = await loadTrip(startFile);
  populateTripSelect(files, startFile);
  setTrip(startFile, data);

  el('viewMapBtn').addEventListener('click', () => showScreen('screen-map'));
  el('mapBackBtn').addEventListener('click', () => { stopPlacing(); showScreen('screen-home'); });
  el('mapAddBtn').addEventListener('click', startPlacing);
  el('placeCancelBtn').addEventListener('click', stopPlacing);
  el('placeConfirmBtn').addEventListener('click', () => {
    const c = map.getCenter();
    stopPlacing();
    openEditor(null, c);
  });
  el('catBackBtn').addEventListener('click', () => { activeCategory = null; showScreen('screen-home'); });
  el('heroCard').addEventListener('click', () => showScreen('screen-map'));

  el('catSettingsItem').addEventListener('click', () => {
    el('menu').classList.remove('open');
    renderCatSettings();
    showScreen('screen-catsettings');
  });
  el('catSettingsBackBtn').addEventListener('click', () => showScreen('screen-home'));

  el('roomStatus').textContent = fbDb ? getRoom() : 'offline';
  el('roomItem').addEventListener('click', () => {
    const current = getRoom();
    const next = prompt('Sync room code (share this with whoever you want to sync with):', current);
    if (!next || next.trim() === current) return;
    localStorage.setItem(ROOM_KEY, next.trim());
    el('roomStatus').textContent = fbDb ? getRoom() : 'offline';
    setTrip(currentTripFile, currentTrip);
    el('menu').classList.remove('open');
  });

  el('photoAddBtn').addEventListener('click', () => el('f-photo-file').click());
  el('photoRemoveBtn').addEventListener('click', () => {
    pendingPhoto = null;
    el('f-photo-file').value = '';
    updatePhotoPreview();
  });
  el('f-photo-file').addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      pendingPhoto = await resizeImageFile(file, 1000, 0.72);
      updatePhotoPreview();
    } catch (err) {
      alert('Could not read that photo: ' + err.message);
    }
  });

  el('menuBtn').addEventListener('click', () => el('menu').classList.add('open'));
  el('menu').addEventListener('click', e => { if (e.target.id === 'menu') el('menu').classList.remove('open'); });

  el('tripSelect').addEventListener('change', async e => {
    const file = e.target.value;
    const data = await loadTrip(file);
    setTrip(file, data);
    el('menu').classList.remove('open');
  });

  el('newTripItem').addEventListener('click', async () => {
    const name = prompt('Trip name?');
    if (!name) return;
    const file = name.toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.json';
    const data = { name, dates:'', center: [20,0], zoom: 4, places: [], visibleCategories: DEFAULT_VISIBLE_CATEGORIES.slice() };
    localStorage.setItem(storageKey(file), JSON.stringify(data));
    const files = await loadTripList();
    const allFiles = files.includes(file) ? files : [...files, file];
    populateTripSelect(allFiles, file);
    setTrip(file, data);
    el('menu').classList.remove('open');
  });

  el('saveBtn').addEventListener('click', saveEditor);
  el('cancelBtn').addEventListener('click', closeEditor);
  el('deleteBtn').addEventListener('click', deletePlace);
  el('editor').addEventListener('click', e => { if (e.target.id === 'editor') closeEditor(); });

  el('exportItem').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(currentTrip, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = currentTripFile;
    a.click();
    URL.revokeObjectURL(url);
  });

  el('importItem').addEventListener('click', () => el('importFile').click());
  el('importFile').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        setTrip(currentTripFile, data);
        saveTrip();
        el('menu').classList.remove('open');
      } catch (err) {
        alert('Could not read that file: ' + err.message);
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  el('search').addEventListener('keydown', async e => {
    if (e.key !== 'Enter') return;
    const q = e.target.value.trim();
    if (!q) return;
    const res = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(q));
    const results = await res.json();
    if (!results.length){ alert('No results for "' + q + '"'); return; }
    const { lat, lon, display_name } = results[0];
    map.flyTo([lat, lon], 14);
    openEditor(null, { lat: parseFloat(lat), lng: parseFloat(lon) });
    el('f-name').value = display_name.split(',')[0];
  });
}

boot();
</script>
</body>
</html>
